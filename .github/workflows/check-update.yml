name: check-update

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:
    inputs:
      version:
        description: "Force version (e.g. 6.7.4, empty = auto)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: check-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - id: bump
        env:
          FORCE_VERSION: ${{ inputs.version }}
          # Authenticated GitHub API (5000 req/h vs 60 anonymous).
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
        run: |
          set -e
          CURRENT=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "current=$CURRENT"
          if [ -n "$FORCE_VERSION" ]; then
            python3 scripts/bump.py --version="$FORCE_VERSION"
          else
            # Fail closed: any real error fails the job (and pages
            # notify-failure) instead of being mistaken for "no update".
            python3 scripts/bump.py
          fi
          NEW=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "new=$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$CURRENT" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --stat

      - name: Create bump PR
        id: cpr
        if: steps.bump.outputs.bumped == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # PAT (not GITHUB_TOKEN) so the PR triggers verify-bump and
          # doesn't get stuck behind approval gates.
          token: ${{ secrets.AUTOMERGE_PAT }}
          commit-message: "bump waterfox-bin to ${{ steps.bump.outputs.version }}"
          branch: bump/waterfox-${{ steps.bump.outputs.version }}
          delete-branch: true
          title: "bump waterfox-bin to ${{ steps.bump.outputs.version }}"
          body: |
            Auto-bump to upstream `${{ steps.bump.outputs.version }}`.

            - Source: https://github.com/BrowserWorks/waterfox/releases/tag/${{ steps.bump.outputs.version }}
            - Tarball: https://cdn.waterfox.com/waterfox/releases/${{ steps.bump.outputs.version }}/Linux_x86_64/waterfox-${{ steps.bump.outputs.version }}.tar.bz2
            - Base packaging: CachyOS `waterfox-bin` (deps/provides/conflicts preserved).

            Checksums + `.SRCINFO` regenerated by `scripts/bump.py`.
          labels: automerge, bump

      - name: Close superseded bump PRs
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          KEEP="bump/waterfox-$VERSION"
          while read -r num branch; do
            [ -n "$num" ] || continue
            if [ "$branch" != "$KEEP" ]; then
              echo "closing superseded #$num ($branch)"
              gh pr comment "$num" --body "Superseded by \`$KEEP\`." || true
              gh pr close "$num" || true
              git push origin --delete "$branch" || true
            fi
          done <<EOF
          $(gh pr list --label bump --state open --json number,headRefName -q '.[] | "\(.number) \(.headRefName)"')
          EOF

  notify-failure:
    needs: bump
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discord notify on bump failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "no webhook configured, skipping"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          run_url = os.environ["RUN_URL"]
          payload = {"embeds": [{
              "title": "check-update failed",
              "description": f"Bump job failed (real error, not 'no update').\n\n[View run]({run_url})",
              "color": 15158332,
          }]}
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"], data=data,
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30):
              pass
          print("notified")
          PY
