name: check-update

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Force version (e.g. 6.7.4, empty = auto)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - id: bump
        env:
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          set -e
          CURRENT=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "current=$CURRENT"
          if [ -n "$FORCE_VERSION" ]; then
            python3 scripts/bump.py --version="$FORCE_VERSION"
          else
            python3 scripts/bump.py || code=$?
            # bump.py exits 0 when no change or bumped, 10 only for --check-only
            code=${code:-0}
            echo "exit=$code"
          fi
          NEW=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "new=$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$CURRENT" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --stat

      - name: Create bump PR
        id: cpr
        if: steps.bump.outputs.bumped == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "bump waterfox-bin to ${{ steps.bump.outputs.version }}"
          branch: bump/waterfox-${{ steps.bump.outputs.version }}
          delete-branch: true
          title: "bump waterfox-bin to ${{ steps.bump.outputs.version }}"
          body: |
            Auto-bump to upstream `${{ steps.bump.outputs.version }}`.

            - Source: https://github.com/BrowserWorks/waterfox/releases/tag/${{ steps.bump.outputs.version }}
            - Tarball: https://cdn.waterfox.com/waterfox/releases/${{ steps.bump.outputs.version }}/Linux_x86_64/waterfox-${{ steps.bump.outputs.version }}.tar.bz2
            - Base packaging: CachyOS `waterfox-bin` (deps/provides/conflicts preserved).

            Checksums + `.SRCINFO` regenerated by `scripts/bump.py`.
          labels: automerge, bump

      - name: Enable automerge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" || \
          gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}" || true
          echo "automerge enabled for #${{ steps.cpr.outputs.pull-request-number }}"
