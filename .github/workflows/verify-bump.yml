name: verify-bump

# Second CI re-hash check for bump PRs.
# check-update.yml opens a PR; this workflow independently re-verifies
# the new PKGBUILD and merges it only after the re-hash passes.

on:
  pull_request:
    paths:
      - "PKGBUILD"
      - ".SRCINFO"
      - "scripts/bump.py"
      - "scripts/verify.py"
      - ".github/workflows/verify-bump.yml"

permissions:
  contents: read

concurrency:
  group: verify-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rehash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Logic lives in scripts/verify.py (single source of truth) —
      # sidecar cross-check + full re-download re-hash + .SRCINFO checks.
      - name: Re-hash tarball + cross-check upstream sidecar + .SRCINFO
        run: python3 scripts/verify.py

  automerge:
    needs: rehash
    # Gate: only bot bump PRs explicitly labeled automerge. Forks / hand-made
    # PRs never match, so they still need a human merge.
    if: startsWith(github.head_ref, 'bump/') && contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge verified bump PR
        env:
          # PAT so the merge commit triggers build.yml on main.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          # Prefer native auto-merge (waits for any remaining checks);
          # fall back to immediate merge if auto-merge isn't enabled.
          gh pr merge --auto --squash --delete-branch "$PR" \
            || gh pr merge --squash --delete-branch "$PR"
          echo "merged #$PR after passing re-hash"

  notify-failure:
    needs: [rehash, automerge]
    if: failure() && startsWith(github.head_ref, 'bump/') && contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discord notify on verify failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "no webhook configured, skipping"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          pr_url = os.environ.get("PR_URL", "")
          payload = {"embeds": [{
              "title": "verify-bump failed",
              "description": f"Re-hash or automerge failed — needs a human look.\n\n[View PR]({pr_url})",
              "color": 15158332,
          }]}
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"], data=data,
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30):
              pass
          print("notified")
          PY
