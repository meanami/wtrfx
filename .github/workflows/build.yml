name: build

on:
  push:
    branches: [main]
    paths:
      - "PKGBUILD"
      - ".SRCINFO"
      - "waterfox.desktop"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "PKGBUILD"
      - ".SRCINFO"
      - "waterfox.desktop"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install git
        run: |
          pacman -Sy --noconfirm --needed git base-devel sudo

      - uses: actions/checkout@v4

      - name: Validate .SRCINFO matches PKGBUILD
        run: |
          . /etc/os-release 2>/dev/null || true
          # lightweight check: pkgver in both files must match
          PKGVER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          SRCVER=$(grep -oP '^\s*pkgver =\s*\K.*' .SRCINFO | head -n1)
          echo "PKGBUILD=$PKGVER .SRCINFO=$SRCVER"
          test "$PKGVER" = "$SRCVER"

      - name: Create builder user
        run: |
          id builder 2>/dev/null || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          cd "$GITHUB_WORKSPACE"
          sudo -u builder makepkg -s --noconfirm --needed
          ls -lh *.pkg.tar.zst
          # GitHub Artifacts / NTFS reject ':' from epoch (e.g. waterfox-bin-1:6.7.4-1-...).
          # Rename for upload; Linux pacman/repo-add still work with the dashed name
          # (.PKGINFO inside still carries epoch=1).
          for f in *.pkg.tar.zst; do
            n="${f//:/-}"
            if [ "$f" != "$n" ]; then mv -v "$f" "$n"; fi
          done
          ls -lh *.pkg.tar.zst

      - name: Namcap check (non-fatal)
        run: |
          cd "$GITHUB_WORKSPACE"
          pacman -S --noconfirm --needed namcap || true
          namcap PKGBUILD || true
          namcap *.pkg.tar.zst || true

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  repo:
    needs: build
    # only publish repo + release from main pushes, not PRs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: ./artifacts

      - name: Build pacman repo database
        run: |
          pacman -Sy --noconfirm --needed base-devel git
          mkdir -p repo/x86_64
          cp ./artifacts/*.pkg.tar.zst repo/x86_64/
          cd repo/x86_64
          # repo name: wtrfx (repo-add already creates .db/.files symlinks)
          repo-add wtrfx.db.tar.gz *.pkg.tar.zst
          ls -lh

      - name: Generate repo index
        run: |
          PKGVER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          PKGREL=$(grep -oP '^pkgrel=\K.*' PKGBUILD)
          echo "PKGVER=$PKGVER PKGREL=$PKGREL"
          echo "pkgver=$PKGVER" >> "$GITHUB_ENV"
          echo "pkgrel=$PKGREL" >> "$GITHUB_ENV"
          cat > repo/index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>wtrfx repo</title>
          <h1>wtrfx – waterfox-bin for CachyOS/Arch</h1>
          <p>Version: <b>$PKGVER-$PKGREL</b></p>
          <p>Add to <code>/etc/pacman.conf</code>:</p>
          <pre>[wtrfx]
          SigLevel = Optional TrustAll
          Server = https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\$arch</pre>
          <p><a href="x86_64/">x86_64/</a></p>
          EOF
          cat repo/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: repo-dir
          path: repo
          if-no-files-found: error

      - name: Create GitHub Release with package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.pkgver }}-${{ env.pkgrel }}
          name: waterfox-bin ${{ env.pkgver }}-${{ env.pkgrel }}
          files: ./artifacts/*.pkg.tar.zst
          fail_on_unmatched_files: true
          generate_release_notes: true

  deploy:
    needs: repo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Delete stale github-pages artifacts in this run (re-runs create duplicates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --paginate -q '.artifacts[] | select(.name=="github-pages") | .id')
          for id in $ids; do echo "deleting github-pages artifact $id"; gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true; done

      - uses: actions/download-artifact@v4
        with:
          name: repo-dir
          path: ./repo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./repo

      - id: deployment
        uses: actions/deploy-pages@v4
