name: build

on:
  push:
    branches: [main]
    paths:
      - "PKGBUILD"
      - ".SRCINFO"
      - "waterfox.desktop"
      - "pacman/wtrfx.gpg"
      - "pacman/wtrfx.conf"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "PKGBUILD"
      - ".SRCINFO"
      - "waterfox.desktop"
      - "pacman/wtrfx.gpg"
      - "pacman/wtrfx.conf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: archlinux:latest
    steps:
      - name: Install git
        run: |
          pacman -Sy --noconfirm --needed git base-devel sudo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate .SRCINFO matches PKGBUILD
        run: |
          . /etc/os-release 2>/dev/null || true
          # lightweight check: pkgver in both files must match
          PKGVER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          SRCVER=$(grep -oP '^\s*pkgver =\s*\K.*' .SRCINFO | head -n1)
          echo "PKGBUILD=$PKGVER .SRCINFO=$SRCVER"
          test "$PKGVER" = "$SRCVER"

      - name: Create builder user
        run: |
          id builder 2>/dev/null || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: /usr/bin/pacman" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          cd "$GITHUB_WORKSPACE"
          sudo -u builder makepkg -s --noconfirm --needed
          ls -lh *.pkg.tar.zst
          # GitHub Artifacts / NTFS reject ':' from epoch (e.g. waterfox-bin-2:6.7.5-1-...).
          # Rename for upload; Linux pacman/repo-add still work with the dashed name
          # (.PKGINFO inside still carries epoch=2).
          for f in *.pkg.tar.zst; do
            n="${f//:/-}"
            if [ "$f" != "$n" ]; then mv -v "$f" "$n"; fi
          done
          ls -lh *.pkg.tar.zst

      - name: Namcap check (non-fatal)
        run: |
          cd "$GITHUB_WORKSPACE"
          pacman -S --noconfirm --needed namcap || true
          namcap PKGBUILD || true
          namcap *.pkg.tar.zst || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  repo:
    needs: build
    # only publish repo + release from main pushes, not PRs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: ./artifacts

      - name: Import repo signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          test -n "$GPG_PRIVATE_KEY" || { echo "GPG_PRIVATE_KEY secret is empty"; exit 1; }
          pacman -Sy --noconfirm --needed gnupg
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys
          # allow non-interactive signing (works with or without passphrase)
          echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye || true

      - name: Build pacman repo database (signed)
        env:
          GPG_KEYID: ${{ secrets.GPG_KEYID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          test -n "$GPG_KEYID" || { echo "GPG_KEYID secret is empty"; exit 1; }
          pacman -Sy --noconfirm --needed base-devel git gnupg
          mkdir -p repo/x86_64
          cp ./artifacts/*.pkg.tar.zst repo/x86_64/
          # Publish the public key alongside the repo
          cp pacman/wtrfx.gpg repo/wtrfx.gpg
          cp pacman/wtrfx.gpg repo/x86_64/wtrfx.gpg
          cd repo/x86_64
          GPG_ARGS=(--batch --yes --pinentry-mode loopback --local-user "$GPG_KEYID")
          if [ -n "$GPG_PASSPHRASE" ]; then
            GPG_ARGS+=(--passphrase "$GPG_PASSPHRASE")
          fi
          # Detached-sign packages so SigLevel=Required verifies them.
          # repo-add -s only signs the database, not the .pkg files.
          for p in *.pkg.tar.zst; do
            [ -e "$p" ] || continue
            rm -f "$p.sig"
            gpg "${GPG_ARGS[@]}" --output "$p.sig" --detach-sign "$p"
          done
          # Signed db (creates .db/.files + .sig symlinks)
          rm -f wtrfx.db.tar.gz wtrfx.db wtrfx.files.tar.gz wtrfx.files
          rm -f wtrfx.db.tar.gz.sig wtrfx.files.tar.gz.sig
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PASSPHRASE" | repo-add -s --key "$GPG_KEYID" --sign wtrfx.db.tar.gz *.pkg.tar.zst
          else
            repo-add -s --key "$GPG_KEYID" --sign wtrfx.db.tar.gz *.pkg.tar.zst
          fi
          # Verify before publishing
          gpg --verify wtrfx.db.tar.gz.sig wtrfx.db.tar.gz
          repo-add --verify --key "$GPG_KEYID" wtrfx.db.tar.gz
          ls -lh

      - name: Generate repo index
        run: |
          PKGVER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          PKGREL=$(grep -oP '^pkgrel=\K.*' PKGBUILD)
          EPOCH=$(grep -oP '^epoch=\K.*' PKGBUILD)
          echo "PKGVER=$PKGVER PKGREL=$PKGREL EPOCH=$EPOCH"
          echo "pkgver=$PKGVER" >> "$GITHUB_ENV"
          echo "pkgrel=$PKGREL" >> "$GITHUB_ENV"
          echo "epoch=$EPOCH" >> "$GITHUB_ENV"
          FPR=$(gpg --show-keys pacman/wtrfx.gpg 2>/dev/null | grep -oE '[0-9A-F]{40}' | head -n1)
          echo "KEY_FPR=$FPR"
          cat > repo/index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>wtrfx repo</title>
          <h1>wtrfx – waterfox-bin for CachyOS/Arch</h1>
          <p>Version: <b>$EPOCH.$PKGVER</b></p>
          <p>Signing key: <code>$FPR</code> (<a href="wtrfx.gpg">wtrfx.gpg</a>)</p>
          <p>Import the key, then add to <code>/etc/pacman.conf</code>:</p>
          <pre>sudo pacman-key --add wtrfx.gpg
          sudo pacman-key --lsign-key $FPR
          [wtrfx]
          SigLevel = Required DatabaseOptional
          Server = https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\$arch</pre>
          <p><a href="x86_64/">x86_64/</a></p>
          EOF
          cat repo/index.html
          # GitHub Pages has no directory listing, so /x86_64/ 404s without an index.
          # Generate a simple file listing for browser/Octopi manual downloads.
          {
            echo '<!doctype html><meta charset="utf-8"><title>x86_64 – wtrfx</title>'
            echo "<h1>wtrfx x86_64 ($EPOCH.$PKGVER)</h1><ul>"
            for f in repo/x86_64/*; do
              b=$(basename "$f")
              [ "$b" = "index.html" ] && continue
              echo "<li><a href=\"$b\">$b</a></li>"
            done
            echo '</ul><p><a href="../">../</a></p>'
          } > repo/x86_64/index.html
          cat repo/x86_64/index.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-dir
          path: repo
          if-no-files-found: error

      - name: Fetch upstream Waterfox changelog
        run: |
          set -e
          VER="${{ env.pkgver }}"; EPOCH="${{ env.epoch }}"
          python3 - "$VER" "$EPOCH" <<'PY'
          import html as ihtml, re, sys, urllib.request

          def clean_item(raw):
              raw = re.sub(r"<img.*?>", "", raw, flags=re.S)
              raw = re.sub(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',
                           lambda m: "[%s](%s)" % (
                               re.sub(r"\s+", " ", ihtml.unescape(
                                   re.sub(r"<[^>]+>", "", m.group(2)))).strip(),
                               ("https://www.waterfox.com" + m.group(1).strip()
                                if m.group(1).strip().startswith("/") else m.group(1).strip())),
                           raw, flags=re.S)
              raw = re.sub(r"<(strong|b)>(.*?)</\1>", r"**\2**", raw, flags=re.S)
              raw = re.sub(r"<code>(.*?)</code>", r"`\1`", raw, flags=re.S)
              raw = re.sub(r"<[^>]+>", "", raw)
              return re.sub(r"\s+", " ", ihtml.unescape(raw)).strip()
          ver, epoch = sys.argv[1], sys.argv[2]
          page_url = f"https://www.waterfox.com/releases/{ver}/"
          gh_tag = f"https://github.com/BrowserWorks/waterfox/releases/tag/{ver}"
          lines = [
              f"Waterfox-bin {epoch}.{ver} for CachyOS/Arch (upstream {ver}).",
              "",
              f"Upstream changelog: {page_url}",
              f"Upstream tag: {gh_tag}",
              "",
              "Install: see README (import `wtrfx.gpg`, `SigLevel = Required DatabaseOptional`).",
          ]
          try:
              req = urllib.request.Request(page_url, headers={"User-Agent": "wtrfx-release/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  page = r.read().decode("utf-8", "replace")
              t = re.search(r'<meta property="og:title" content="([^"]+)"', page)
              d = re.search(r'<meta property="og:description" content="([^"]+)"', page)
              headline = ihtml.unescape(t.group(1)).strip() if t else ver
              headline = re.sub(r"^Waterfox\s+", "", headline)
              headline = re.sub(r"\s*—\s*Release Notes$", "", headline)
              summary = ihtml.unescape(d.group(1)).strip() if d else ""
              sections = []
              pm = re.search(r'<div data-sw-prose.*?>(.*?)</div>\s*</article>', page, re.S)
              if pm:
                  parts = re.split(r'<h2[^>]*>(.*?)</h2>', pm.group(1))
                  for i in range(1, len(parts), 2):
                      name = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", parts[i])).strip()
                      body = parts[i + 1] if i + 1 < len(parts) else ""
                      items = []
                      for it in re.findall(r"<li[^>]*>(.*?)</li>", body, re.S):
                          it = clean_item(it)
                          if it:
                              items.append(it)
                      if name and items:
                          sections.append((name, items))
              lines += ["", "---", "", f"## Upstream Waterfox changelog — {headline}"]
              if summary:
                  lines += ["", summary]
              for name, items in sections:
                  lines += ["", f"### {name}", ""]
                  lines += [f"- {it}" for it in items]
              print(f"changelog: {headline}, {sum(len(items) for _, items in sections)} items")
          except Exception as e:
              print(f"waterfox.com fetch failed: {e}")
              lines += ["", "(Full changelog: see upstream link above.)"]
          with open("release-body.md", "w") as f:
              f.write("\n".join(lines).rstrip() + "\n")
          PY
          head -c 2000 release-body.md

      - name: Create GitHub Release with package
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.epoch }}.${{ env.pkgver }}
          name: waterfox-bin ${{ env.epoch }}.${{ env.pkgver }}
          body_path: release-body.md
          files: |
            ./artifacts/*.pkg.tar.zst
            repo/x86_64/*.pkg.tar.zst.sig
            repo/x86_64/wtrfx.db.tar.gz
            repo/x86_64/wtrfx.db.tar.gz.sig
            repo/x86_64/wtrfx.files.tar.gz.sig
            repo/wtrfx.gpg
          fail_on_unmatched_files: true
          generate_release_notes: true

  deploy:
    needs: repo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Delete stale github-pages artifacts in this run (re-runs create duplicates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --paginate -q '.artifacts[] | select(.name=="github-pages") | .id')
          for id in $ids; do echo "deleting github-pages artifact $id"; gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true; done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo-dir
          path: ./repo

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./repo

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    needs: [build, repo, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: PKGBUILD

      - name: Discord notify on build result
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "no webhook configured, skipping"; exit 0; fi
          URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '[:space:]')"
          echo "url_len=${#URL}"
          PKGVER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          EPOCH=$(grep -oP '^epoch=\K.*' PKGBUILD)
          python3 - "$PKGVER" "$EPOCH" <<'PY'
          import datetime, html as ihtml, json, os, re, sys, urllib.request

          def clean_item(raw):
              raw = re.sub(r"<img.*?>", "", raw, flags=re.S)
              raw = re.sub(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',
                           lambda m: "[%s](%s)" % (
                               re.sub(r"\s+", " ", ihtml.unescape(
                                   re.sub(r"<[^>]+>", "", m.group(2)))).strip(),
                               ("https://www.waterfox.com" + m.group(1).strip()
                                if m.group(1).strip().startswith("/") else m.group(1).strip())),
                           raw, flags=re.S)
              raw = re.sub(r"<(strong|b)>(.*?)</\1>", r"**\2**", raw, flags=re.S)
              raw = re.sub(r"<code>(.*?)</code>", r"`\1`", raw, flags=re.S)
              raw = re.sub(r"<[^>]+>", "", raw)
              return re.sub(r"\s+", " ", ihtml.unescape(raw)).strip()
          ver, epoch = sys.argv[1], sys.argv[2]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          needs = json.loads(os.environ.get("NEEDS_JSON", "{}"))
          results = {k: v.get("result", "unknown") for k, v in needs.items()}
          failed = any(r in ("failure", "cancelled", "timed_out") for r in results.values())
          run_url = f"{server}/{repo}/actions/runs/{run_id}"
          rel_url = f"{server}/{repo}/releases/tag/v{epoch}.{ver}"
          upstream_page = f"https://www.waterfox.com/releases/{ver}/"
          GREEN, RED = 3066993, 15158332
          LOGO = "https://upload.wikimedia.org/wikipedia/commons/2/2a/Waterfox_logo_2019.png"
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()

          def fetch_changelog(v):
              req = urllib.request.Request(
                  f"https://www.waterfox.com/releases/{v}/",
                  headers={"User-Agent": "wtrfx-notify/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  page = r.read().decode("utf-8", "replace")
              t = re.search(r'<meta property="og:title" content="([^"]+)"', page)
              d = re.search(r'<meta property="og:description" content="([^"]+)"', page)
              headline = ihtml.unescape(t.group(1)).strip() if t else v
              headline = re.sub(r"^Waterfox\s+", "", headline)
              headline = re.sub(r"\s*—\s*Release Notes$", "", headline)
              summary = ihtml.unescape(d.group(1)).strip() if d else ""
              sections = []
              pm = re.search(r'<div data-sw-prose.*?>(.*?)</div>\s*</article>', page, re.S)
              if pm:
                  parts = re.split(r'<h2[^>]*>(.*?)</h2>', pm.group(1))
                  for i in range(1, len(parts), 2):
                      name = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", parts[i])).strip()
                      body = parts[i + 1] if i + 1 < len(parts) else ""
                      items = []
                      for it in re.findall(r"<li[^>]*>(.*?)</li>", body, re.S):
                          it = clean_item(it)
                          if it:
                              items.append(it)
                      if name and items:
                          sections.append((name, items))
              return headline, summary, sections

          if failed:
              detail = ", ".join(f"{k}={v}" for k, v in sorted(results.items()))
              payload = {"username": "Waterfox", "avatar_url": LOGO, "embeds": [{
                  "title": f"❌ waterfox-bin {epoch}.{ver} build failed",
                  "description": f"{detail}\n\n[View run]({run_url})",
                  "color": RED,
                  "footer": {"text": "wtrfx • Arch/CachyOS repo"},
                  "timestamp": now,
              }]}
          else:
              try:
                  headline, summary, sections = fetch_changelog(ver)
              except Exception as e:
                  print(f"changelog fetch failed: {e}")
                  headline, summary, sections = ver, "", []
              codename = headline[len(ver):].lstrip(" —-") if headline.startswith(ver) else headline
              title = f"waterfox-bin {epoch}.{ver}" + (f" — {codename}" if codename else "")
              links = f"[Full changelog]({upstream_page}) • [Release]({rel_url}) • [Run]({run_url})"
              header_desc = summary.strip() if summary else ""
              embeds = [{
                  "title": title[:256],
                  "url": upstream_page,
                  "description": header_desc[:4096],
                  "color": GREEN,
              }]
              if not header_desc:
                  del embeds[0]["description"]
              # one embed per changelog section (Discord: max 10 embeds, 6000 chars total)
              budget = 6000 - len(header_desc) - 500
              slots = 10 - len(embeds)
              if len(sections) > slots:
                  shown, hidden = sections[:slots - 1], sections[slots - 1:]
              else:
                  shown, hidden = sections, []
              for name, items in shown:
                  if budget <= 200:
                      hidden = [(name, items)] + hidden
                      break
                  cap = min(3500, budget)
                  rows, total, cut = [], 0, False
                  for it in items:
                      row = f"- {it}"
                      if rows and total + len(row) + 1 > cap:
                          cut = True
                          break
                      rows.append(row)
                      total += len(row) + 1
                  if cut:
                      rows.append("…")
                  if not rows:  # single huge item: hard-truncate as last resort
                      rows = [f"- {items[0][:cap - 3]}…"]
                  body = "\n".join(rows)
                  embeds.append({"title": name[:256], "description": body, "color": GREEN})
                  budget -= len(body)
              if hidden:
                  names = ", ".join(n for n, _ in hidden)
                  embeds.append({
                      "title": "More",
                      "description": f"Also in this release: {names}\n\n{links}",
                      "color": GREEN,
                  })
              embeds[-1]["footer"] = {"text": "wtrfx • Arch/CachyOS repo"}
              embeds[-1]["timestamp"] = now
              payload = {"username": "Waterfox", "avatar_url": LOGO, "embeds": embeds}
          with open("/tmp/discord.json", "w") as f:
              json.dump(payload, f)
          print("payload bytes:", len(json.dumps(payload)))
          PY
          curl -fsSL -X POST -H 'Content-Type: application/json' -d @/tmp/discord.json "$URL" -o /dev/null -w 'discord_http=%{http_code}\n'

